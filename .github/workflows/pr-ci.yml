name: Pull request CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: PR CI / Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Pin .NET SDK for this run
        run: |
          cat > global.json <<'JSON'
          {
            "sdk": {
              "version": "10.0.404",
              "rollForward": "disable"
            }
          }
          JSON

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Borderland.Dreams.sln

      - name: Build
        run: dotnet build Borderland.Dreams.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Borderland.Dreams.sln --configuration Release --no-build --no-restore --logger trx --results-directory TestResults

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
